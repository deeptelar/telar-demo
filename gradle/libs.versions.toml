[versions]
kotlin = "2.4.20"
compose = "1.12.1"
agp = "9.4.1"
androidx-activity = "1.13.0"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.6.0"
telar = "0.1.0-alpha09"

[libraries]
telar-core = { module = "dev.deeptelar:telar-core", version.ref = "telar" }
telar-agent = { module = "dev.deeptelar:telar-agent", version.ref = "telar" }
telar-anthropic = { module = "dev.deeptelar:telar-anthropic", version.ref = "telar" }
telar-openai = { module = "dev.deeptelar:telar-openai", version.ref = "telar" }
telar-serialization = { module = "dev.deeptelar:telar-serialization", version.ref = "telar" }
telar-checkpoint-file = { module = "dev.deeptelar:telar-checkpoint-file", version.ref = "telar" }
telar-checkpoint-browser = { module = "dev.deeptelar:telar-checkpoint-browser", version.ref = "telar" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-animation = { module = "org.jetbrains.compose.animation:animation-core", version.ref = "compose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
